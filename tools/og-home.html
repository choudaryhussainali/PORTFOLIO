<!doctype html>
<meta charset="utf-8">
<title>og</title>
<style>
  @font-face { font-family: "Schibsted"; src: url("/assets/fonts/SchibstedGrotesk-var.woff2") format("woff2"); font-weight: 400 800; font-display: block; }
  @font-face { font-family: "Satoshi"; src: url("/assets/fonts/Satoshi-400.woff2") format("woff2"); font-weight: 400; font-display: block; }
  @font-face { font-family: "Satoshi"; src: url("/assets/fonts/Satoshi-500.woff2") format("woff2"); font-weight: 500; font-display: block; }
  @font-face { font-family: "Satoshi"; src: url("/assets/fonts/Satoshi-700.woff2") format("woff2"); font-weight: 700; font-display: block; }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }

  /* the homepage's own tokens */
  body {
    position: relative;
    display: flex;
    align-items: center;
    padding: 0 470px 0 72px;
    font-family: "Satoshi", system-ui, sans-serif;
    color: #fff;
    background:
      radial-gradient(105% 85% at 12% 0%, rgba(0, 240, 255, 0.16) 0%, rgba(0, 240, 255, 0) 56%),
      radial-gradient(95% 90% at 88% 8%, rgba(131, 56, 236, 0.30) 0%, rgba(131, 56, 236, 0) 60%),
      radial-gradient(90% 70% at 50% 108%, rgba(255, 0, 110, 0.14) 0%, rgba(255, 0, 110, 0) 62%),
      linear-gradient(168deg, #141b2d 0%, #0a0e27 48%, #060818 100%);
  }
  /* the seam the site puts at the top of its colour blocks */
  body::before {
    content: ""; position: absolute; inset: 0 0 auto 0; height: 5px;
    background: linear-gradient(90deg, #00f0ff 0%, #8338ec 55%, #ff006e 100%);
  }

  .eyebrow {
    font-family: "Satoshi", sans-serif;
    font-size: 19px; font-weight: 700; letter-spacing: 0.22em;
    text-transform: uppercase; color: #00f0ff; margin-bottom: 22px;
  }
  h1 {
    font-family: "Schibsted", system-ui, sans-serif;
    font-size: 68px; font-weight: 800; line-height: 1.02;
    letter-spacing: -0.022em; margin-bottom: 20px;
  }
  h1 span {
    background: linear-gradient(120deg, #00f0ff 0%, #8338ec 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .role {
    font-size: 27px; font-weight: 500; line-height: 1.4;
    color: #c3cdea; margin-bottom: 30px; white-space: nowrap;
  }
  ul { list-style: none; display: flex; gap: 30px; margin-bottom: 34px; }
  li {
    font-size: 18px; font-weight: 500; color: #a8b4d4;
    display: flex; align-items: center; gap: 9px;
  }
  li::before {
    content: ""; width: 9px; height: 9px; border-radius: 50%;
    background: #00f0ff; box-shadow: 0 0 12px rgba(0, 240, 255, 0.9);
  }
  li:nth-child(2)::before { background: #8338ec; box-shadow: 0 0 12px rgba(131, 56, 236, .9); }
  li:nth-child(3)::before { background: #ff006e; box-shadow: 0 0 12px rgba(255, 0, 110, .9); }
  .site {
    font-size: 21px; font-weight: 700; letter-spacing: 0.02em; color: #fff;
    padding-top: 22px; border-top: 1px solid rgba(0, 240, 255, 0.22);
    display: inline-block;
  }

  /* the portrait, bled off the right edge and tinted into the palette */
  .shot {
    position: absolute; right: 0; top: 0; width: 540px; height: 630px; overflow: hidden;
    -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 44%);
    mask-image: linear-gradient(90deg, transparent 0%, #000 44%);
  }
  .shot img {
    width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%;
    filter: grayscale(1) contrast(1.08) brightness(1.04);
  }
  /* fade it into the block on the left, and lay the brand light over it */
  .shot::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(200deg, rgba(0, 240, 255, 0.22) 0%, rgba(131, 56, 236, 0.28) 58%, rgba(255, 0, 110, 0.18) 100%);
  }
</style>

<div class="copy">
  <p class="eyebrow">Lahore, Pakistan</p>
  <h1>Choudary<br><span>Hussain Ali</span></h1>
  <p class="role">Sr. Shopify &amp; Full-Stack Developer</p>
  <ul>
    <li>50+ projects</li>
    <li>Shopify Plus</li>
    <li>AI &amp; automation</li>
  </ul>
  <p class="site">choudaryhussainali.online</p>
</div>

<div class="shot"><img src="/assets/profile.png" alt=""></div>
